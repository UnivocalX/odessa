http:
  addr: ":9090"

storage:
  fs:
    disabled: true

  s3:
    region: "us-east-1"
    endpoint: "http://localhost:9000"

  azure:
    disabled: true
    account: ""
    connection_string: ""
    account_key: ""
    use_default_credential: false

worker:
  poll_interval: 5s
  max_poll_interval: 2m
  concurrency: 4
  max_attempts: 3
  drain_timeout: 30s